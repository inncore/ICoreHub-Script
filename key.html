<!DOCTYPE html>
<html>
<head>
    <title>ICoreHub Premium Key</title>
    <style>
        body { background-color: #141419; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 15%; }
        .box { background-color: #1e1e23; padding: 40px; border-radius: 15px; display: inline-block; border: 2px solid #3296ff; box-shadow: 0 0 20px rgba(50, 150, 255, 0.2); }
        .title { color: #3296ff; font-size: 28px; font-weight: 900; margin-bottom: 10px; margin-top: 0;}
        .key-text { background-color: #141419; padding: 15px 30px; border-radius: 8px; font-size: 32px; font-family: monospace; font-weight: bold; color: #50ff64; border: 1px dashed #50ff64; margin: 20px 0; }
        .sub { color: #888; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 class="title">ICoreHub</h2>
        <p>Thanks for supporting 1nncore! Here is your daily key:</p>
        <div class="key-text" id="keyDisplay">Loading...</div>
        <p class="sub">This key changes automatically every 24 hours.</p>
    </div>

    <script>
        function getDailyKey() {
            const d = new Date();
            // Получаем UTC дату: YYYY-MM-DD
            const dateStr = d.getUTCFullYear() + "-" + 
                            String(d.getUTCMonth() + 1).padStart(2, '0') + "-" + 
                            String(d.getUTCDate()).padStart(2, '0');
            
            // Наш секретный алгоритм
            const secret = "SuperICoreSecret_2026";
            const combined = dateStr + secret;
            
            let hash = 0;
            for (let i = 0; i < combined.length; i++) {
                hash = ((hash * 31) + combined.charCodeAt(i)) % 9999999;
            }
            return "ICORE-" + hash;
        }
        document.getElementById("keyDisplay").innerText = getDailyKey();
    </script>
</body>
</html>
